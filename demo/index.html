<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catabolic · Catalog explorer</title><link rel="stylesheet" href="style.css?v=viewport-1"><script src="app.js?v=formats-2" defer></script></head>
<body><a class="skip" href="#workspace">Skip to catalog</a><header><a class="brand" href="./">Catabolic <span>/ demo catalog</span></a><nav><a href="https://github.com/Jagalite/catabolic/wiki">Docs ↗</a><a href="https://github.com/Jagalite/catabolic">GitHub ↗</a></nav></header>
<main id="workspace"><section class="content"><p id="loading" role="status">Loading catalog…</p><div id="view" hidden><div class="trees"><div class="input-column"><section class="tree-panel source-panel"><div class="tree-header"><h2>Source files</h2><span class="badge">Unchanged</span></div><div id="source-tree"></div></section><section class="query-panel"><h2>Select a query</h2><nav id="queries" aria-label="Catalog query selections"></nav><div class="sql-panel"><div class="language-tabs" aria-label="Query language"><button id="sql-tab" type="button" aria-pressed="true">SQL</button><button id="graphql-tab" type="button" aria-pressed="false">GraphQL</button></div><pre id="sql"></pre></div></section></div><div class="output-column"><section class="output-controls"><h2>Output layout</h2><nav id="projections" aria-label="Projection layouts"></nav></section><section class="tree-panel output-panel"><div class="tree-header"><h2 id="title">Projected library</h2><span class="badge" id="count"></span></div><div id="output-tree" aria-live="polite"></div></section></div></div></div></section></main><footer><span>No live drive access · Switching selections does not publish files.</span><span id="version"></span></footer></body></html>
