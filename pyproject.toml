[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catabolic"
version = "0.1.0"
description = "Programmable media catalog with query-driven rules and safe output projections"
requires-python = ">=3.11"
dependencies = ["graphql-core==3.2.12", "pydantic==2.13.5"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Jagalite/catabolic"
Documentation = "https://github.com/Jagalite/catabolic/wiki"
Repository = "https://github.com/Jagalite/catabolic"
Issues = "https://github.com/Jagalite/catabolic/issues"

[project.optional-dependencies]
notifications = ["apprise==1.13.1"]
dev = ["ruff==0.16.6", "jsonschema==4.26.0"]

[project.scripts]
catabolic = "catabolic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catabolic = ["migrations/*.sql", "migrations/*.license", "interchange/releases/*.json", "interchange/releases/*.md", "interchange/releases/*.license", "guides/*.md"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
