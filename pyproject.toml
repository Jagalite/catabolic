[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catabolic"
version = "0.1.0"
description = "Media inventory and recoverable symbolic-link catalogs"
requires-python = ">=3.11"
dependencies = ["graphql-core==3.2.12", "pydantic==2.13.5"]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["ruff==0.16.6", "jsonschema==4.26.0"]

[project.scripts]
catabolic = "catabolic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catabolic = ["migrations/*.sql", "interchange/releases/*.json", "interchange/releases/*.md", "guides/*.md"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
