[package]
name = "catabolic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "catabolic-native"
path = "src/main.rs"

[[bin]]
name = "catabolic-legacy-native"
path = "src/legacy_main.rs"

[dependencies]
catabolic-core.workspace = true
catabolic-store.workspace = true
catabolic-runtime.workspace = true
catabolic-http.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test builds only: enables catabolic-store's test-only observation hooks for
# the workspace test build, so its failpoint-gated test targets build and run.
# The normal dependency above never enables them (scripts/check_failpoints_graph.py).
catabolic-store = { workspace = true, features = ["failpoints"] }

[lints]
workspace = true
