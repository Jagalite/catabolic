[package]
name = "catabolic-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
getrandom.workspace = true
catabolic-core.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
serde.workspace = true
jsonschema.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
tempfile.workspace = true
libc.workspace = true
sha2.workspace = true
hmac.workspace = true
fancy-regex.workspace = true
base64.workspace = true
unicode-normalization.workspace = true
async-graphql.workspace = true
async-graphql-parser.workspace = true
async-graphql-value.workspace = true
futures.workspace = true
async-trait.workspace = true

[dev-dependencies]
# Actual retained-child lifecycle for private provenance unit fixtures.
catabolic-runtime.workspace = true

[features]
# Test-only: request-field crash injection, and the observation hooks in
# native restore, native backup and journal conversion. Off by default; never
# enabled for shipped binaries or wheels (`catabolic-cli` enables it only as a
# dev-dependency).
failpoints = []

[[test]]
name = "native_restore"
required-features = ["failpoints"]

[[test]]
name = "journal_conversion"
required-features = ["failpoints"]

[lints]
workspace = true
