name: Tests and interchange contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -q
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: catabolic spec check
      - name: Preserve previously released schemas and references
        env:
          SPEC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          base = os.environ.get('SPEC_BASE', '')
          if base and set(base) != {'0'}:
              subprocess.run(['python', 'scripts/check_spec_releases.py', base], check=True)
          PY
