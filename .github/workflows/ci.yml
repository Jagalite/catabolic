name: Tests and interchange contract
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Require real probe/decode tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg poppler-utils tesseract-ocr
          else
            brew install ffmpeg poppler tesseract
          fi
          ffmpeg -version
          ffprobe -version
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock'
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - run: python scripts/audit_dependencies.py --report dependency-audit.json
      - run: python -m unittest discover -s tests -q
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: catabolic spec check
      - name: Preserve previously released schemas and references
        env:
          SPEC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          base = os.environ.get('SPEC_BASE', '')
          if base and set(base) != {'0'}:
              subprocess.run(['python', 'scripts/check_spec_releases.py', base], check=True)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-${{ matrix.os }}-${{ matrix.python }}
          path: dependency-audit.json

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/release.lock'
      - run: python scripts/sync_docs.py --check
      - run: python -m build --no-isolation --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Validate distribution contents and versions
        run: python scripts/check_distribution.py --dist dist --ref "$GITHUB_REF" --report "$RUNNER_TEMP/distribution-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-report
          path: ${{ runner.temp }}/distribution-report.json
          if-no-files-found: error

  acceptance:
    needs: wheel
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install required media tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist
      - name: Install exact wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/catabolic-release"
          "$RUNNER_TEMP/catabolic-release/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock
          "$RUNNER_TEMP/catabolic-release/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/runtime.lock
          "$RUNNER_TEMP/catabolic-release/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/catabolic-release/bin/python" -m pip check
          "$RUNNER_TEMP/catabolic-release/bin/catabolic" docs enrichment
      - name: Installed CLI and representative media
        run: python scripts/acceptance.py --cli "$RUNNER_TEMP/catabolic-release/bin/catabolic" --root "$RUNNER_TEMP/media-acceptance"
      - name: Installed consumer protocol lifecycle
        run: python scripts/consumer_acceptance.py --cli "$RUNNER_TEMP/catabolic-release/bin/catabolic" --root "$RUNNER_TEMP/consumer-acceptance"
      - name: Optional Apprise partial delivery
        run: |
          "$RUNNER_TEMP/catabolic-release/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/notifications.lock
          python scripts/notification_acceptance.py --cli "$RUNNER_TEMP/catabolic-release/bin/catabolic" --root "$RUNNER_TEMP/notification-acceptance"
      - name: Messy collection reference journey
        run: |
          python scripts/experience_acceptance.py --python "$RUNNER_TEMP/catabolic-release/bin/python" --root "$RUNNER_TEMP/experience-acceptance"
          python scripts/experience_evaluator.py --root "$RUNNER_TEMP/experience-acceptance"
      - name: Real filesystem boundaries and unmounts
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo "$(command -v python)" scripts/storage_acceptance.py --cli "$RUNNER_TEMP/catabolic-release/bin/catabolic" --report "$RUNNER_TEMP/storage-acceptance.json"
          else
            python scripts/storage_acceptance.py --cli "$RUNNER_TEMP/catabolic-release/bin/catabolic" --report "$RUNNER_TEMP/storage-acceptance.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/media-acceptance/report.json
            ${{ runner.temp }}/consumer-acceptance/report.json
            ${{ runner.temp }}/notification-acceptance/report.json
            ${{ runner.temp }}/storage-acceptance.json
            ${{ runner.temp }}/experience-acceptance/*.json
            ${{ runner.temp }}/experience-acceptance/*.jsonl

  jellyfin:
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist
      - run: |
          python -m venv "$RUNNER_TEMP/catabolic-consumer"
          "$RUNNER_TEMP/catabolic-consumer/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock
          "$RUNNER_TEMP/catabolic-consumer/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/runtime.lock
          "$RUNNER_TEMP/catabolic-consumer/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/catabolic-consumer/bin/python" -m pip check
      - name: Real Jellyfin scan and playback
        run: python scripts/acceptance.py --cli "$RUNNER_TEMP/catabolic-consumer/bin/catabolic" --root "$RUNNER_TEMP/jellyfin-acceptance" --jellyfin-image jellyfin/jellyfin:10.11.8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: jellyfin-acceptance
          path: |
            ${{ runner.temp }}/jellyfin-acceptance/report.json
            ${{ runner.temp }}/jellyfin-acceptance/jellyfin.log

  http:
    needs: wheel
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install media tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions
          path: dist
      - name: Install HTTP extra with locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/catabolic-http"
          "$RUNNER_TEMP/catabolic-http/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/http-test.lock
          "$RUNNER_TEMP/catabolic-http/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/catabolic-http/bin/python" -m pip check
      - name: Authorization, streaming and local execution gates
        run: '"$RUNNER_TEMP/catabolic-http/bin/python" -m unittest tests.test_execution_claims tests.test_http_backend tests.test_http_renditions tests.test_http_review -q'
      - name: Installed client, server and worker journey
        run: 'python scripts/http_acceptance.py --python "$RUNNER_TEMP/catabolic-http/bin/python" --root "$RUNNER_TEMP/http-acceptance"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: http-acceptance-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/http-acceptance/report.json
            ${{ runner.temp }}/http-acceptance/serve.log
            ${{ runner.temp }}/http-acceptance/worker.log

  release-verification:
    if: always()
    needs: [test, wheel, acceptance, jellyfin, http]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation lanes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, value in results.items() if value['result'] != 'success']
          if failed:
              raise SystemExit('Release verification failed: ' + ', '.join(failed))
          print('All release validation lanes passed for this commit and wheel.')
          PY
