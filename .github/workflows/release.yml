name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI after all checks (requires a matching vVERSION tag and PYPI_API_TOKEN)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check package version and release tag
        env:
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          if [ "$PUBLISH" = true ]; then
            python scripts/check_distribution.py --version-only --ref "$GITHUB_REF" --require-tag
          else
            python scripts/check_distribution.py --version-only --ref "$GITHUB_REF"
          fi

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/catabolic/
    steps:
      - name: Require the PyPI token for explicit publication
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo 'Add PYPI_API_TOKEN to the repository or pypi environment before requesting publication.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist
      - name: Publish the tested distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          attestations: false
